<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 图书借阅管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-md-block bg-dark sidebar" style="min-height:100vh; padding:20px;">
                <h4 class="text-white mb-4">📚 图书系统</h4>
                <div class="nav flex-column">
                    <button class="nav-link btn btn-outline-light mb-2 text-start" onclick="switchTab('search')">🔍 查询图书</button>
                    <button class="nav-link btn btn-outline-light mb-2 text-start" onclick="switchTab('borrow')">📝 办理借书</button>
                    <button class="nav-link btn btn-outline-light mb-2 text-start" onclick="switchTab('return')">🔄 办理还书</button>
                    <button class="nav-link btn btn-outline-light mb-2 text-start" onclick="switchTab('fine')">💰 缴纳罚金</button>
                    <button class="nav-link btn btn-outline-light mb-2 text-start" onclick="switchTab('admin')">⚙️ 系统维护</button>
                    <button class="nav-link btn btn-outline-light mb-2 text-start" onclick="switchTab('recommend')">🤖 智能推荐</button>
                    <button class="nav-link btn btn-outline-light mb-2 text-start" onclick="switchTab('reader_manage')">👥 读者信息</button>
                    <hr style="border-color:#555;">
                    <button class="nav-link btn btn-outline-danger mb-2 text-start" onclick="logout()">🚪 退出登录</button>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4" style="padding-top:20px;">
                <h2 id="pageTitle" class="mb-3">🔍 馆藏图书查询</h2>
                <hr class="mb-4">

                <!-- 搜索 -->
                <div id="tab-search" class="tab-content">
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <input type="text" id="searchInput" class="form-control" placeholder="输入书名或作者搜索...">
                        </div>
                        <div class="col-md-4">
                            <select id="categoryFilter" class="form-select">
                                <option value="0">📚 全部分类</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary w-100" onclick="searchBooks()">🔍 搜索</button>
                        </div>
                    </div>
                    <div id="searchResults"></div>
                </div>

                <!-- 借书 -->
                <div id="tab-borrow" class="tab-content" style="display:none;">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold">选择读者</label>
                            <select id="borrowReader" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold">选择图书</label>
                            <select id="borrowBook" class="form-select"></select>
                        </div>
                    </div>
                    <button class="btn btn-success mt-3" onclick="borrowBook()">提交借阅</button>
                    <div id="borrowResult" class="mt-3"></div>
                </div>

                <!-- 还书板块 -->
                <div id="tab-return" class="tab-content" style="display:none;">
                    <!-- 读者搜索与选择 -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold">🔍 快速查找读者</label>
                            <input type="text" id="returnReaderSearchInput" class="form-control" 
                                placeholder="输入读者姓名或手机号进行筛选..." oninput="filterReturnReaders()">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold">👤 选择读者</label>
                            <select id="returnReader" class="form-select" onchange="onReturnReaderSelected()">
                                <option value="">请先选择或搜索读者...</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-3">

                    <!-- 读者当前未还图书列表展示区 -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="mb-0">📖 该读者待归还图书列表</h5>
                        <span id="borrowCountBadge" class="badge bg-secondary">未选择读者</span>
                    </div>

                    <div id="returnBooksContainer" class="mt-3">
                        <div class="alert alert-light border text-center text-muted">
                            请在上方面板选择一位读者以查看其名下的借阅书籍
                        </div>
                    </div>

                    <!-- 还书结果消息提示 -->
                    <div id="returnResult" class="mt-3"></div>
                </div>

                <!-- 罚金板块 -->
                <div id="tab-fine" class="tab-content" style="display:none;">
                    <!-- 🔍 新增：罚单搜索筛选栏 -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <input type="text" id="fineSearchInput" class="form-control" 
                                placeholder="🔍 输入读者姓名筛选罚单..." oninput="filterFines()">
                        </div>
                        <div class="col-md-6 d-flex align-items-center">
                            <span id="fineCountBadge" class="text-muted small">加载中...</span>
                        </div>
                    </div>

                    <!-- 罚单卡片列表 -->
                    <div id="fineList"></div>
                    
                    <!-- 缴纳按钮与提示 -->
                    <button class="btn btn-danger mt-3" onclick="payFine()">缴纳选中罚单</button>
                    <div id="fineResult" class="mt-3"></div>
                </div>

                <!-- 系统维护 -->
                <div id="tab-admin" class="tab-content" style="display:none;">
                    <button class="btn btn-danger" onclick="scanAndFreeze()">⚡ 执行逾期检查与冻结</button>
                    <div id="adminResult" class="mt-3"></div>
                    <hr class="my-4">
                    <h5>⚠️ 违规与冻结名单</h5>
                    <div id="violatorList" class="mt-3"></div>
                </div>

                <!-- 推荐 -->
                <div id="tab-recommend" class="tab-content" style="display:none;">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label font-weight-bold">选择目标读者</label>
                            <select id="recommendReader" class="form-select"></select>
                        </div>
                    </div>
                    <button class="btn btn-info text-white mt-3" onclick="getRecommend()">🤖 生成智能推荐</button>
                    <div id="recommendResult" class="mt-4"></div>
                </div>

                <!-- 读者信息管理 -->
                <div id="tab-reader_manage" class="tab-content" style="display:none;">
                    <h5 class="mb-3">➕ 添加新读者</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label font-weight-bold">👤 读者姓名</label>
                            <input type="text" id="readerName" class="form-control" placeholder="请输入读者姓名">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label font-weight-bold">📞 联系电话</label>
                            <input type="text" id="readerPhone" class="form-control" placeholder="请输入11位手机号" 
                                   maxlength="11" 
                                   oninput="this.value = this.value.replace(/\D/g, '')">
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button class="btn btn-success w-100" onclick="addReader()">✅ 添加读者</button>
                        </div>
                    </div>
                    <div id="addReaderResult" class="mt-3 mb-3"></div>
                    <hr>
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <input type="text" id="readerSearchInput" class="form-control" placeholder="🔍 输入姓名或手机号搜索读者...">
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-primary w-100" onclick="searchReaders()">🔍 搜索</button>
                        </div>
                    </div>
                    <h5 class="mb-3">📋 读者列表</h5>
                    <div id="readerList" class="reader-list-container"></div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
